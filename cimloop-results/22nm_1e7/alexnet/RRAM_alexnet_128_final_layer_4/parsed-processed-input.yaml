mapper:
    optimization_metrics:
      - edp
    version: '0.4'
    live_status: false
    num_threads: 1
    search_size: 10000
    victory_condition: 100
    timeout: 10000
    max_permutations_per_if_visit: 16
    algorithm: random_pruned
    max_temporal_loops_in_a_mapping: 14
    diagnostics: false
    out_prefix: timeloop-mapper
    optimization_metric: []
    sync_interval: null
    log_interval: 1
    log_oaves: false
    log_oaves_mappings: false
    log_stats: false
    log_suboptimal: false
    penalize_consecutive_bypass_fails: false
    emit_whoop_nest: false
    filter_revisits: false
mapspace:
    version: '0.4'
    template: uber
globals:
    version: '0.4'
    environment_variables:
        TIMELOOP_OUTPUT_STAT_SCIENTIFIC: 1
        TIMELOOP_OUTPUT_STAT_DEFAULT_FLOAT: 0
        TIMELOOP_HIDE_INCONSEQUENTIAL_STATS: 0
    expression_custom_functions:
      - /home/workspace/models/include/slicing_encoding.py
    accelergy_plug_ins:
      - /home/workspace/models/components/accelergy_plug_ins
